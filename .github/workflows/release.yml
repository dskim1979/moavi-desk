name: Release

# Push a tag like v1.1.5: builds every platform and attaches them to one GitHub release -
# Windows (MSI with virt-viewer, the single exe), macOS (.dmg for Apple Silicon and Intel), Android (APK).
# The release notes are docs/release-notes.md (how to install on each OS) followed by GitHub's change list.
# Nothing is published anywhere else (no WinGet, no App Store, no Play).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # virt-viewer for Windows (GPLv2+), bundled under <install>\virt-viewer. See README.md (설치 프로그램).
  VIRT_VIEWER_URL: https://gitlab.com/virt-viewer/virt-viewer/-/releases/v11.0/downloads/virt-viewer-x64-11.0-1.0.msi
  # SHA-256 of that MSI; the release stops if the download differs
  VIRT_VIEWER_SHA256: 'B7DE0474E97FE1E81101F2406FCF603FE08666BCB3816C3C465C8D64330BE610'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download virt-viewer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/downloads | Out-Null
          $msi = "artifacts/downloads/virt-viewer-x64.msi"
          Invoke-WebRequest $env:VIRT_VIEWER_URL -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          Write-Host "virt-viewer SHA-256: $hash"
          if ($env:VIRT_VIEWER_SHA256 -and $hash -ne $env:VIRT_VIEWER_SHA256) { throw "virt-viewer hash mismatch" }
          if (-not $env:VIRT_VIEWER_SHA256) { Write-Host "::warning::VIRT_VIEWER_SHA256 is not pinned ($hash)" }

      - name: Publish and MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./installer/build.ps1 -Version $version -VirtViewerMsi artifacts/downloads/virt-viewer-x64.msi
          Copy-Item artifacts/publish/win-x64/moavi-desk.exe "artifacts/msi/moavi-desk-$version-win-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: moavi-desk-windows
          path: |
            artifacts/msi/*.msi
            artifacts/msi/*.exe
          if-no-files-found: error

  # macOS and Android, the version from the tag
  apps:
    uses: ./.github/workflows/build-apps.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [windows, apps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/$version/g" docs/release-notes.md > notes.md
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --title "MOAVI Desk $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes dist/*
